# This workflow will run unit tests for the current project

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: # Allows triggering the workflow manually in GitHub UI

permissions:
  contents: read

# If another push to the same PR or branch happens while this workflow is still running,
# cancel the earlier run in favor of the next run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.package-manager }}, ${{ matrix.node-version || 'bun-latest' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20.x, 22.x]
        package-manager: [npm, yarn, pnpm]
        include:
          - package-manager: npm
            install-cmd: npm ci
            run-prefix: npm run
            test-cmd: npm test
            node-cache: npm
          - package-manager: yarn
            install-cmd: yarn install --frozen-lockfile
            run-prefix: yarn
            test-cmd: yarn test
            node-cache: yarn
          - package-manager: pnpm
            install-cmd: pnpm install
            run-prefix: pnpm run
            test-cmd: pnpm test
            node-cache: pnpm
          # bun manages its own runtime; added as a standalone combination
          - package-manager: bun
            os: ubuntu-latest
            install-cmd: bun install
            run-prefix: bun run
            test-cmd: bun run test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        if: matrix.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Use Node.js ${{ matrix.node-version }}
        if: matrix.package-manager != 'bun'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ matrix.node-cache }}

      - name: Setup Bun
        if: matrix.package-manager == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: ${{ matrix.install-cmd }}

      - name: Build project
        run: ${{ matrix.run-prefix }} build

      - name: Lint project
        run: ${{ matrix.run-prefix }} lint:all

      - name: Check README spelling
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2
        with:
          ignore_words_file: .codespellignore
          path: README.md

      - name: Check code spelling
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2
        with:
          ignore_words_file: .codespellignore
          path: src/

      - name: Run tests
        run: ${{ matrix.test-cmd }}
