# This workflow will run integration tests for the current project once per day

name: Integration Tests

on:
  schedule:
    - cron: "37 14 * * *" # Run at 7:37 AM Pacific Time (14:37 UTC) every day
  workflow_dispatch: # Allows triggering the workflow manually in GitHub UI

permissions:
  contents: read

# If another scheduled run starts while this workflow is still running,
# cancel the earlier run in favor of the next run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration Tests (${{ matrix.package-manager }}, ${{ matrix.node-version || 'bun-latest' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20.x, 22.x]
        package-manager: [npm, yarn, pnpm]
        include:
          - package-manager: npm
            install-cmd: npm ci
            run-prefix: npm run
            node-cache: npm
          - package-manager: yarn
            install-cmd: yarn install --frozen-lockfile
            run-prefix: yarn
            node-cache: yarn
          - package-manager: pnpm
            install-cmd: pnpm install
            run-prefix: pnpm run
            node-cache: pnpm
          # bun manages its own runtime; added as a standalone combination
          - package-manager: bun
            os: ubuntu-latest
            install-cmd: bun install
            run-prefix: bun run
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        if: matrix.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Use Node.js ${{ matrix.node-version }}
        if: matrix.package-manager != 'bun'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ matrix.node-cache }}

      - name: Setup Bun
        if: matrix.package-manager == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: ${{ matrix.install-cmd }}

      - name: Build project
        run: ${{ matrix.run-prefix }} build

      - name: Run integration tests
        run: ${{ matrix.run-prefix }} test:int
